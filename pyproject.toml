[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polytranslate"
version = "0.1.0"
description = "Translate legacy code (COBOL) to Python, Java, or Go"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Iago Pueyo", email = "iago.pueyo99@gmail.com" }]
keywords = ["cobol", "translation", "legacy", "modernization", "transpiler"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["polytranslate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
