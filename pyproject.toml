[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polytranslate"
version = "0.1.0"
description = "Translate legacy code (COBOL) to Python, Java, or Go"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Iago Pueyo", email = "iago.pueyo99@gmail.com" }]
keywords = ["cobol", "translation", "legacy", "modernization", "transpiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/iagop03/polytranslate"
Repository = "https://github.com/iagop03/polytranslate"
Issues = "https://github.com/iagop03/polytranslate/issues"

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.0"]
dev = ["pytest", "pytest-cov", "ruff"]
all = ["typer>=0.12", "rich>=13.0"]

[project.scripts]
polytranslate = "polytranslate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["polytranslate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
